services:
  postgres:
    image: postgres:17-alpine
    container_name: reliability-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reliability}
      POSTGRES_DB: ${POSTGRES_DB:-reliability}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - reliability-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reliability} -d ${POSTGRES_DB:-reliability}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  reliability-pgdata:
